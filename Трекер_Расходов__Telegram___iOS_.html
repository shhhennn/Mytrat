<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c101c" />
  <meta name="color-scheme" content="dark" />
  <title>Мои Расходы</title>

  <!-- Telegram Web App SDK (загружается асинхронно с защитой от сбоев) -->
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>

  <style>
    :root {
      --bg: #0c101c;
      --card-bg: #141b2d;
      --card-border: #232d46;
      --accent: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 70px);
      overflow-x: hidden;
    }

    .header {
      padding: 14px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .currency-select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    .main-container {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .balance-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .balance-card::before {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 120px;
      height: 120px;
      background: rgba(59, 130, 246, 0.15);
      border-radius: 50%;
      filter: blur(25px);
      pointer-events: none;
    }

    .period-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
      width: fit-content;
      margin-bottom: 12px;
    }

    .period-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .period-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    .total-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .total-amount {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 4px 0 14px;
      color: #ffffff;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 12px;
      border-radius: 14px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 700;
    }

    .chart-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
    }

    .chart-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prog-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .prog-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }

    .prog-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .cat-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .search-box {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      outline: none;
    }
    .search-box::placeholder {
      color: var(--text-muted);
    }

    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .expense-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .expense-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .expense-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .expense-info {
      overflow: hidden;
    }

    .expense-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .expense-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .expense-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .expense-sum {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #64748b;
      font-size: 16px;
      padding: 4px;
      cursor: pointer;
    }

    .btn-delete:active {
      color: var(--danger);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, var(--bg) 65%, transparent);
      padding: 10px 16px calc(var(--safe-bottom) + 10px);
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 40;
    }

    .btn-add {
      pointer-events: auto;
      width: 100%;
      max-width: 480px;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-add:active {
      transform: scale(0.98);
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      background: #161e31;
      border-top: 1px solid var(--card-border);
      border-radius: 28px 28px 0 0;
      width: 100%;
      max-width: 500px;
      padding: 20px 20px calc(var(--safe-bottom) + 20px);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-muted);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    .cat-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 4px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .cat-btn.selected {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent);
      color: #60a5fa;
    }

    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-title">
      <span>💸</span> Мои Расходы
    </div>
    <select id="currencySelect" class="currency-select" onchange="changeCurrency(this.value)">
      <option value="₽">₽ RUB</option>
      <option value="$">$ USD</option>
      <option value="€">€ EUR</option>
      <option value="₸">₸ KZT</option>
      <option value="₴">₴ UAH</option>
    </select>
  </header>

  <main class="main-container">
    <!-- Карточка баланса -->
    <div class="balance-card">
      <div class="period-switch">
        <button id="btnPeriodMonth" class="period-btn active" onclick="setPeriod('month')">Текущий месяц</button>
        <button id="btnPeriodAll" class="period-btn" onclick="setPeriod('all')">Все время</button>
      </div>
      <div class="total-label">Сумма расходов</div>
      <div class="total-amount" id="totalDisplay">0 ₽</div>

      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-label">Средний чек</div>
          <div class="stat-value" id="avgDisplay">0 ₽</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Операций</div>
          <div class="stat-value" id="countDisplay">0</div>
        </div>
      </div>
    </div>

    <!-- Диаграмма по категориям -->
    <div class="chart-container" id="chartCard">
      <div class="chart-header">
        <span>РАСПРЕДЕЛЕНИЕ ТРАТ</span>
        <span id="chartPeriodNote">за месяц</span>
      </div>
      <div class="progress-bar-list" id="progressList">
        <!-- Полосы категорий генерируются динамически -->
      </div>
    </div>

    <!-- Поиск и фильтры -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск по названию..." oninput="handleSearch()" />

    <div class="categories-bar" id="categoryPills">
      <!-- Сгенерируется в JS -->
    </div>

    <!-- Список операций -->
    <div class="expense-list" id="expenseList">
      <!-- Элементы трат -->
    </div>
  </main>

  <!-- Нижняя кнопка добавления -->
  <div class="bottom-bar">
    <button class="btn-add" onclick="openAddModal()">
      <span>＋</span> Добавить расход
    </button>
  </div>

  <!-- Модальное окно добавления -->
  <div class="modal-overlay" id="addModal" onclick="if(event.target === this) closeAddModal()">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Новый расход</div>
        <button class="modal-close" onclick="closeAddModal()">✕</button>
      </div>

      <form id="addExpenseForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label class="form-label">Сумма (<span class="form-curr-sym">₽</span>)</label>
          <input type="number" id="inputAmount" class="form-input" step="any" placeholder="0" required inputmode="decimal" autofocus />
        </div>

        <div class="form-group">
          <label class="form-label">Название покупки</label>
          <input type="text" id="inputTitle" class="form-input" placeholder="Например: Супермаркет, Такси" required />
        </div>

        <div class="form-group">
          <label class="form-label">Категория</label>
          <div class="cat-selector" id="catSelector">
            <!-- Кнопки выбора категории -->
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Дата</label>
          <input type="date" id="inputDate" class="form-input" />
        </div>

        <button type="submit" class="btn-add" style="margin-top: 10px;">
          Сохранить расход
        </button>
      </form>
    </div>
  </div>

  <script>
    // Категории трат
    const CATEGORIES = [
      { id: 'food', name: 'Еда', icon: '🍔', color: '#f59e0b' },
      { id: 'transport', name: 'Транспорт', icon: '🚕', color: '#3b82f6' },
      { id: 'shopping', name: 'Покупки', icon: '🛍️', color: '#ec4899' },
      { id: 'leisure', name: 'Отдых', icon: '🍿', color: '#8b5cf6' },
      { id: 'home', name: 'Жильё', icon: '🏠', color: '#10b981' },
      { id: 'health', name: 'Аптека', icon: '💊', color: '#ef4444' },
      { id: 'other', name: 'Прочее', icon: '✨', color: '#64748b' }
    ];

    // Безопасное хранилище (никогда не вызывает белый экран даже при блокировке куки/localStorage)
    const SafeStorage = {
      memory: {},
      get(key, fallback) {
        try {
          const val = localStorage.getItem(key);
          return val !== null ? JSON.parse(val) : fallback;
        } catch (e) {
          return this.memory[key] !== undefined ? this.memory[key] : fallback;
        }
      },
      set(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {
          this.memory[key] = val;
        }
      }
    };

    // Состояние приложения
    let currency = SafeStorage.get('app_currency', '₽');
    let currentPeriod = 'month';
    let selectedCatFilter = 'all';
    let searchQuery = '';
    let selectedModalCat = 'food';

    let expenses = SafeStorage.get('app_expenses', [
      { id: '1', title: 'Продукты на неделю', amount: 2450, categoryId: 'food', date: new Date().toISOString().slice(0, 10) },
      { id: '2', title: 'Яндекс Такси', amount: 490, categoryId: 'transport', date: new Date().toISOString().slice(0, 10) }
    ]);

    // Инициализация Telegram WebApp с виброоткликом
    function triggerHaptic(type) {
      try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
          if (type === 'success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
          else if (type === 'impact') window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
      } catch (e) {}
    }

    function formatMoney(num) {
      return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + ' ' + currency;
    }

    function setPeriod(period) {
      currentPeriod = period;
      document.getElementById('btnPeriodMonth').classList.toggle('active', period === 'month');
      document.getElementById('btnPeriodAll').classList.toggle('active', period === 'all');
      document.getElementById('chartPeriodNote').textContent = period === 'month' ? 'за месяц' : 'за все время';
      triggerHaptic('impact');
      render();
    }

    function changeCurrency(newCurr) {
      currency = newCurr;
      SafeStorage.set('app_currency', currency);
      document.querySelectorAll('.form-curr-sym').forEach(el => el.textContent = currency);
      triggerHaptic('impact');
      render();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      renderListOnly();
    }

    function deleteExpense(id) {
      triggerHaptic('impact');
      expenses = expenses.filter(item => item.id !== id);
      SafeStorage.set('app_expenses', expenses);
      render();
    }

    function getFilteredItems() {
      const now = new Date();
      const currentYearMonth = now.toISOString().slice(0, 7); // "YYYY-MM"

      return expenses.filter(item => {
        // Фильтр по периоду
        if (currentPeriod === 'month') {
          if (!item.date || !item.date.startsWith(currentYearMonth)) return false;
        }

        // Фильтр по категории
        if (selectedCatFilter !== 'all' && item.categoryId !== selectedCatFilter) return false;

        // Поиск
        if (searchQuery) {
          const titleMatch = item.title.toLowerCase().includes(searchQuery);
          const cat = CATEGORIES.find(c => c.id === item.categoryId);
          const catMatch = cat && cat.name.toLowerCase().includes(searchQuery);
          if (!titleMatch && !catMatch) return false;
        }

        return true;
      });
    }

    function renderListOnly() {
      const items = getFilteredItems();
      const listEl = document.getElementById('expenseList');

      if (items.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 32px; margin-bottom: 6px;">📝</div>
            <div>Нет расходов за этот период</div>
          </div>
        `;
        return;
      }

      listEl.innerHTML = items.map(item => {
        const cat = CATEGORIES.find(c => c.id === item.categoryId) || CATEGORIES[CATEGORIES.length - 1];
        const dateStr = item.date ? item.date.split('-').reverse().slice(0, 2).join('.') : '';

        return `
          <div class="expense-item">
            <div class="expense-left">
              <div class="expense-icon" style="background:${cat.color}22;">${cat.icon}</div>
              <div class="expense-info">
                <div class="expense-title">${escapeHtml(item.title)}</div>
                <div class="expense-meta">${cat.name} • ${dateStr}</div>
              </div>
            </div>
            <div class="expense-right">
              <div class="expense-sum">-${formatMoney(item.amount)}</div>
              <button class="btn-delete" title="Удалить" onclick="deleteExpense('${item.id}')">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function render() {
      const items = getFilteredItems();

      // Расчёт сумм
      const total = items.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
      const avg = items.length > 0 ? total / items.length : 0;

      document.getElementById('totalDisplay').textContent = formatMoney(total);
      document.getElementById('avgDisplay').textContent = formatMoney(avg);
      document.getElementById('countDisplay').textContent = items.length;

      // Анализ категорий
      const catTotals = {};
      items.forEach(item => {
        catTotals[item.categoryId] = (catTotals[item.categoryId] || 0) + Number(item.amount || 0);
      });

      const progList = document.getElementById('progressList');
      const sortedCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);

      if (sortedCats.length === 0) {
        progList.innerHTML = `<div style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 8px;">Нет данных для диаграммы</div>`;
      } else {
        progList.innerHTML = sortedCats.slice(0, 4).map(([catId, amount]) => {
          const cat = CATEGORIES.find(c => c.id === catId) || CATEGORIES[CATEGORIES.length - 1];
          const percent = total > 0 ? Math.round((amount / total) * 100) : 0;

          return `
            <div class="prog-item">
              <div class="prog-labels">
                <span>${cat.icon} ${cat.name}</span>
                <span style="color:var(--text-muted)">${formatMoney(amount)} (${percent}%)</span>
              </div>
              <div class="prog-track">
                <div class="prog-fill" style="width: ${percent}%; background: ${cat.color};"></div>
              </div>
            </div>
          `;
        }).join('');
      }

      renderListOnly();
    }

    function openAddModal() {
      triggerHaptic('impact');
      document.getElementById('inputDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('inputAmount').value = '';
      document.getElementById('inputTitle').value = '';
      document.getElementById('addModal').classList.add('open');
      setTimeout(() => document.getElementById('inputAmount').focus(), 150);
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('open');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('inputAmount').value);
      const title = document.getElementById('inputTitle').value.trim();
      const date = document.getElementById('inputDate').value || new Date().toISOString().slice(0, 10);

      if (!amount || !title) return;

      const newItem = {
        id: Date.now().toString(),
        amount,
        title,
        categoryId: selectedModalCat,
        date
      };

      expenses.unshift(newItem);
      SafeStorage.set('app_expenses', expenses);

      triggerHaptic('success');
      closeAddModal();
      render();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Инициализация при загрузке страницы
    window.addEventListener('DOMContentLoaded', () => {
      // Инициализация Telegram
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      // Установка сохранённой валюты
      document.getElementById('currencySelect').value = currency;
      document.querySelectorAll('.form-curr-sym').forEach(el => el.textContent = currency);

      // Генерация фильтров-таблеток
      const pillsContainer = document.getElementById('categoryPills');
      pillsContainer.innerHTML = `
        <button class="cat-pill ${selectedCatFilter === 'all' ? 'active' : ''}" onclick="selectFilter('all')">Все</button>
        ${CATEGORIES.map(c => `
          <button class="cat-pill ${selectedCatFilter === c.id ? 'active' : ''}" onclick="selectFilter('${c.id}')">${c.icon} ${c.name}</button>
        `).join('')}
      `;

      // Генерация кнопок в модалке
      const catSelector = document.getElementById('catSelector');
      catSelector.innerHTML = CATEGORIES.map(c => `
        <div class="cat-btn ${selectedModalCat === c.id ? 'selected' : ''}" onclick="selectModalCategory('${c.id}')">
          <span style="font-size: 20px;">${c.icon}</span>
          <span>${c.name}</span>
        </div>
      `).join('');

      render();
    });

    window.selectFilter = function(catId) {
      selectedCatFilter = catId;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(catId === 'all' ? 'Все' : (CATEGORIES.find(c => c.id === catId)?.name || '')));
      });
      triggerHaptic('impact');
      render();
    };

    window.selectModalCategory = function(catId) {
      selectedModalCat = catId;
      document.querySelectorAll('.cat-btn').forEach((btn, idx) => {
        btn.classList.toggle('selected', CATEGORIES[idx].id === catId);
      });
      triggerHaptic('impact');
    };
  </script>
</body>
</html>
